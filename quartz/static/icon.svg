  <rect stroke="none" x="14" y="0" width="4" height="5"/>
  <rect stroke="none" x="14" y="27" width="4" height="5"/>
  <rect stroke="none" x="0" y="14" width="5" height="4"/>
  <rect stroke="none" x="27" y="14" width="5" height="4"/>
  <line x1="4" y1="4" x2="9" y2="9" stroke-width="3.4"/>
  <line x1="28" y1="4" x2="23" y2="9" stroke-width="3.4"/>
  <line x1="4" y1="28" x2="9" y2="23" stroke-width="3.4"/>
  <line x1="28" y1="28" x2="23" y2="23" stroke-width="3.4"/>
</svg>
